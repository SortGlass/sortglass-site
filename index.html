<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SortGlass</title>

  <meta
    name="description"
    content="SortGlass is a fast, fluid way to organize your photo library."
  >

  <link rel="stylesheet" href="styles.css">

  <link rel="icon" type="image/png" href="sortglass-logo.png">
  <link rel="apple-touch-icon" href="sortglass-logo.png">
</head>

<body>

  <main class="hero">

    <div class="glass-card">

      <img
        src="sortglass-logo.png"
        alt="SortGlass logo"
        class="hero-logo"
      >

      <div class="eyebrow">SORTGLASS</div>

      <h1>
        Make room for<br>
        what matters.
      </h1>

      <p class="subtitle">
        A fast, fluid way to organize your photo library —
        one photo at a time.
      </p>

      <div class="actions">

        <a
          class="button primary"
          href="mailto:support@sortglass.com"
        >
          Contact Support
        </a>

        <a
          class="button secondary"
          href="privacy.html"
        >
          Privacy Policy
        </a>

      </div>

      <p class="coming-soon">
        Coming soon to the App Store.
      </p>

    </div>

  </main>

  <footer>

    <span>© 2026 SortGlass</span>

    <a href="privacy.html">
      Privacy
    </a>

    <a href="mailto:support@sortglass.com">
      Support
    </a>

  </footer>

</body>
</html>
